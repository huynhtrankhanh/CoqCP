name: Adversarial Proof Checking

on:
  push:
    branches: [main]
    paths:
      - '**.v'
      - 'tools/adversarial/**'
      - 'verification/trusted_axioms.json'
      - '_CoqProject'
      - 'coqcp-toolchain.opam'
      - 'tools/install-toolchain.sh'
      - '.github/actions/setup-rocq/**'
      - '.github/workflows/adversarial.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance-and-containment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The outer container permits namespace creation; every submitted compiler
    # and proof checker runs inside the inner Bubblewrap/seccomp sandbox.
    container:
      image: ubuntu:26.04
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - uses: actions/checkout@v4
      - name: Install Rocq and stdpp
        uses: ./.github/actions/setup-rocq
      - name: Build shared theories and generated definitions
        run: |
          rocq makefile -f _CoqProject -o Makefile
          make -j2
      - name: Create an unprivileged evaluator user
        run: |
          useradd --uid 10001 --create-home proofchecker
          chown -R proofchecker:proofchecker .
      - name: Run adversarial acceptance and sandbox regressions
        run: runuser -u proofchecker -- python3 -m unittest discover -s tools/adversarial/tests -v
      - name: Check every program's spec and full candidate proof chain
        run: runuser -u proofchecker -- python3 tools/adversarial/examples.py --output .verification/ci-examples
      - name: Upload checked artifacts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-check-results
          path: .verification/ci-examples
          if-no-files-found: ignore
