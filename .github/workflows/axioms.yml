name: Rocq Axiom Check

on:
  push:
    branches:
      - main
    paths:
      - '**.v'
      - '_CoqProject'
      - 'coqcp-toolchain.opam'
      - 'tools/install-toolchain.sh'
      - '.github/actions/setup-rocq/**'
      - '.github/workflows/axioms.yml'
      - 'verification/trusted_axioms.json'
      - 'tools/adversarial/ci_policy.py'
      - 'tools/adversarial/context_policy.py'
  pull_request:
    branches:
      - main

jobs:
  coq-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ubuntu:26.04
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rocq and stdpp
      uses: ./.github/actions/setup-rocq

    - name: Generate the Rocq Makefile
      run: rocq makefile -f _CoqProject -o Makefile

    - name: Run make
      run: make -j2

    - name: Check all compiled proofs against the CI axiom policy
      shell: bash
      run: |
        # The generated validate target checks every module in _CoqProject
        # using its declared load paths, including Generated and GeneratedExamples.
        if ! s=$(make --no-print-directory --silent validate COQCHKFLAGS='-silent --output-context' 2>&1); then
          printf '%s\n' "$s"
          exit 1
        fi
        printf '%s\n' "$s" | python3 tools/adversarial/context_policy.py
