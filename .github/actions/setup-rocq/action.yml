name: Install Rocq master toolchain
description: Install Rocq master and compatible libraries in /opt/rocq
runs:
  using: composite
  steps:
    - name: Install build and sandbox dependencies
      shell: bash
      run: |
        task_sudo=
        if [ "$(id -u)" != 0 ]; then task_sudo=sudo; fi
        $task_sudo apt-get update
        $task_sudo apt-get install -y --no-install-recommends ca-certificates curl git python3 build-essential ocaml opam libgmp-dev pkg-config m4 rsync unzip passwd util-linux
        $task_sudo mkdir -p /opt/rocq
        $task_sudo chown "$(id -u):$(id -g)" /opt/rocq
    - name: Install the proof dependencies
      shell: bash
      run: |
        bash tools/install-toolchain.sh
        echo /opt/rocq/master/bin >> "$GITHUB_PATH"
